# Local infrastructure only. The API and desktop app run on the host.
services:
  db:
    image: postgres:16-alpine
    # Back after a reboot or a crash whenever Docker runs (M5 D1): the calendar's refresh token
    # lives here, and the desktop's calendar goes stale an hour after the API loses it. The API
    # itself does not come back: run `make dev-api` after a reboot.
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roger
    ports:
      - "5432:5432"
    volumes:
      - roger-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  roger-pgdata:
