# Packaging config. Signing and notarization arrive in M11; the Info.plist keys are needed now
# because macOS 14.2+ silently delivers a dead system-audio track without NSAudioCaptureUsageDescription.
appId: ai.linkt.roger
productName: Roger
copyright: Copyright © 2026 Linkt
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
mac:
  category: public.app-category.productivity
  minimumSystemVersion: '14.2'
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: Roger uses the microphone to transcribe what you say in meetings.
    NSAudioCaptureUsageDescription: Roger captures system audio to transcribe what other people say on your calls.
