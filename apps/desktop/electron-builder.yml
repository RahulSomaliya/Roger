# Packaging config. Signing and notarization arrive in M11; the Info.plist keys are needed now
# because macOS 14.2+ silently delivers a dead system-audio track without NSAudioCaptureUsageDescription.
appId: ai.linkt.roger
productName: Roger
copyright: Copyright © 2026 Linkt
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
mac:
  category: public.app-category.productivity
  minimumSystemVersion: '14.2'
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # roger-audio, the Swift audio helper (M2 D1), lands at Contents/Resources/bin/roger-audio.
  # src/main/native/helperPath.ts runs it from there and helperPath.test.ts fails if the paths
  # here disagree with it. electron-builder only WARNS when this source is missing and packages an
  # app without the helper, so scripts/install-mac.sh builds it first (scripts/build-native.sh),
  # then re-signs it as ai.linkt.roger.audio and fails the install if it is missing. The build is
  # for this Mac's CPU only: `pnpm package:mac` (arm64 and x64) neither builds it nor makes it
  # universal. That, and signing it here, is M11.
  extraResources:
    - from: native/bin/roger-audio
      to: bin/roger-audio
    # The menu bar icons (src/main/app/tray.ts trayIconPath reads Resources/tray/): `build/` is
    # electron-builder's own resource folder and is not inside the app, so a packaged Roger would
    # have no menu bar item without this. The filter keeps entitlements.mac.plist out.
    - from: build
      to: tray
      filter:
        - tray*Template*.png
  extendInfo:
    NSMicrophoneUsageDescription: Roger uses the microphone to transcribe what you say in meetings.
    NSAudioCaptureUsageDescription: Roger captures system audio to transcribe what other people say on your calls.
