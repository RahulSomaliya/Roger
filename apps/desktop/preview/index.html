<!doctype html>
<!--
  The renderer preview: src/renderer/src/main.tsx in a browser tab with a fake window.roger.
  `data-state` goes loading, then ready once the scenario is drawn (or error, with data-error);
  qa/driver.ts waits on it. No Content-Security-Policy here, unlike src/renderer/index.html: Vite's
  dev server injects React Refresh's preamble as an inline script, which `script-src 'self'` blocks.
-->
<html lang="en" data-state="loading">
  <head>
    <meta charset="UTF-8" />
    <title>Roger preview</title>
    <!-- No icon request: a browser asks for /favicon.ico (Electron never does), and its 404 is a
         console error that fails every QA check. -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
