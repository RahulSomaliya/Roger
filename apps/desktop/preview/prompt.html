<!doctype html>
<!--
  The prompt panel's preview: src/renderer/src/prompt/PromptApp.tsx in a browser tab with a fake
  window.rogerPrompt. `?card=` picks the panel's state (promptScenarios.ts). `data-state` goes
  loading, then ready once the panel has drawn, as on index.html; qa/driver.ts waits on it, and
  reads `data-preview` to know this page has no window.__rogerPreview to settle on.
-->
<html lang="en" data-state="loading" data-preview="prompt">
  <head>
    <meta charset="UTF-8" />
    <!-- src/renderer/prompt.html's policy, unchanged (index.test.ts fails if they differ). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*"
    />
    <title>Roger prompt preview</title>
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="stage"><div id="root"></div></div>
    <script type="module" src="./prompt.tsx"></script>
  </body>
</html>
